<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-label="ACoS measures only ad-attributed sales while TACoS measures ad spend against total sales, and a break-even ACoS example: a $19.97 product with $8.32 Amazon fees and $4.00 COGS leaves $7.65 profit, a 38% break-even ACoS and a $7.65 maximum cost per acquisition.">
  <defs>
    <linearGradient id="navyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1B2A"/>
      <stop offset="1" stop-color="#1A3A5C"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="800" height="440" rx="18" fill="#F8FAFC"/>

  <!-- Title -->
  <text x="40" y="52" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="24" font-weight="800" fill="#0D1B2A">ACoS vs. TACoS — and where profit lives</text>

  <!-- ACoS card -->
  <rect x="40" y="78" width="345" height="150" rx="14" fill="#ffffff" stroke="#E2E8F0"/>
  <text x="64" y="112" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="16" font-weight="800" fill="#64748B">ACoS — the narrow view</text>
  <text x="64" y="150" font-family="Inter, Arial, sans-serif" font-size="15" fill="#0D1B2A">Ad Spend</text>
  <line x1="64" y1="162" x2="200" y2="162" stroke="#94A3B8" stroke-width="2"/>
  <text x="64" y="184" font-family="Inter, Arial, sans-serif" font-size="15" fill="#0D1B2A">Ad-Attributed Sales</text>
  <text x="64" y="214" font-family="Inter, Arial, sans-serif" font-size="13" fill="#94A3B8">Ignores every organic sale your ads create</text>

  <!-- TACoS card -->
  <rect x="415" y="78" width="345" height="150" rx="14" fill="url(#navyGrad)"/>
  <text x="439" y="112" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="16" font-weight="800" fill="#FF6B35">TACoS — the full view</text>
  <text x="439" y="150" font-family="Inter, Arial, sans-serif" font-size="15" fill="#ffffff">Ad Spend</text>
  <line x1="439" y1="162" x2="600" y2="162" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <text x="439" y="184" font-family="Inter, Arial, sans-serif" font-size="15" fill="#ffffff">Total Sales (organic + ads)</text>
  <text x="439" y="214" font-family="Inter, Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.65)">The number that tracks real profitability</text>

  <!-- Break-even math strip -->
  <rect x="40" y="252" width="720" height="150" rx="14" fill="#ffffff" stroke="#E2E8F0"/>
  <text x="64" y="286" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="16" font-weight="800" fill="#0D1B2A">Break-even ACoS, worked example</text>

  <text x="64" y="330" font-family="Inter, Arial, sans-serif" font-size="15" fill="#0D1B2A">$19.97</text>
  <text x="64" y="350" font-family="Inter, Arial, sans-serif" font-size="12" fill="#94A3B8">price</text>
  <text x="150" y="330" font-family="Inter, Arial, sans-serif" font-size="15" fill="#94A3B8">−</text>
  <text x="172" y="330" font-family="Inter, Arial, sans-serif" font-size="15" fill="#0D1B2A">$8.32</text>
  <text x="172" y="350" font-family="Inter, Arial, sans-serif" font-size="12" fill="#94A3B8">Amazon fees</text>
  <text x="262" y="330" font-family="Inter, Arial, sans-serif" font-size="15" fill="#94A3B8">−</text>
  <text x="284" y="330" font-family="Inter, Arial, sans-serif" font-size="15" fill="#0D1B2A">$4.00</text>
  <text x="284" y="350" font-family="Inter, Arial, sans-serif" font-size="12" fill="#94A3B8">COGS</text>
  <text x="360" y="330" font-family="Inter, Arial, sans-serif" font-size="15" fill="#94A3B8">=</text>
  <text x="384" y="330" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="15" font-weight="800" fill="#10B981">$7.65 profit</text>

  <line x1="520" y1="300" x2="520" y2="382" stroke="#E2E8F0" stroke-width="1"/>

  <rect x="548" y="306" width="90" height="66" rx="10" fill="rgba(26,86,219,0.08)"/>
  <text x="593" y="332" text-anchor="middle" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="20" font-weight="800" fill="#1A56DB">38%</text>
  <text x="593" y="356" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#64748B">break-even ACoS</text>

  <rect x="650" y="306" width="90" height="66" rx="10" fill="rgba(255,107,53,0.10)"/>
  <text x="695" y="332" text-anchor="middle" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="20" font-weight="800" fill="#FF6B35">$7.65</text>
  <text x="695" y="356" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#64748B">max CPA</text>

  <text x="40" y="428" font-family="Inter, Arial, sans-serif" font-size="12" fill="#94A3B8">SellTru — manage Amazon PPC to TACoS and profit, not campaign-level ACoS.</text>
</svg>
