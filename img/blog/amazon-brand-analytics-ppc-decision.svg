<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" role="img" aria-label="The Brand Analytics PPC decision: every search term gets sorted into Defend, Scale, Test, or Avoid based on win probability, not search volume.">
  <rect width="880" height="360" fill="#F8FAFC" rx="16"/>
  <text x="40" y="52" font-family="'Plus Jakarta Sans',Arial,sans-serif" font-size="24" font-weight="800" fill="#0D1B2A">Defend, Scale, Test, or Avoid</text>
  <text x="40" y="80" font-family="Inter,Arial,sans-serif" font-size="15" fill="#64748B">Every Brand Analytics search term gets one verdict, based on win probability.</text>

  <!-- Defend -->
  <g>
    <rect x="40" y="110" width="190" height="150" rx="12" fill="#0D1B2A"/>
    <text x="62" y="146" font-family="'Plus Jakarta Sans',Arial,sans-serif" font-size="13" font-weight="700" fill="#FF6B35">DEFEND</text>
    <text x="62" y="178" font-family="Inter,Arial,sans-serif" font-size="13" fill="#CBD5E1">Branded terms and</text>
    <text x="62" y="196" font-family="Inter,Arial,sans-serif" font-size="13" fill="#CBD5E1">terms you already</text>
    <text x="62" y="214" font-family="Inter,Arial,sans-serif" font-size="13" fill="#CBD5E1">win. Protect the</text>
    <text x="62" y="232" font-family="Inter,Arial,sans-serif" font-size="13" fill="#CBD5E1">traffic.</text>
  </g>
  <!-- Scale -->
  <g>
    <rect x="250" y="110" width="190" height="150" rx="12" fill="#1A56DB"/>
    <text x="272" y="146" font-family="'Plus Jakarta Sans',Arial,sans-serif" font-size="13" font-weight="700" fill="#FFD9C9">SCALE</text>
    <text x="272" y="178" font-family="Inter,Arial,sans-serif" font-size="13" fill="#DBEAFE">Proven purchases,</text>
    <text x="272" y="196" font-family="Inter,Arial,sans-serif" font-size="13" fill="#DBEAFE">winnable field. Move</text>
    <text x="272" y="214" font-family="Inter,Arial,sans-serif" font-size="13" fill="#DBEAFE">to exact match with</text>
    <text x="272" y="232" font-family="Inter,Arial,sans-serif" font-size="13" fill="#DBEAFE">its own budget.</text>
  </g>
  <!-- Test -->
  <g>
    <rect x="460" y="110" width="190" height="150" rx="12" fill="#1A3A5C"/>
    <text x="482" y="146" font-family="'Plus Jakarta Sans',Arial,sans-serif" font-size="13" font-weight="700" fill="#FF6B35">TEST</text>
    <text x="482" y="178" font-family="Inter,Arial,sans-serif" font-size="13" fill="#CBD5E1">Good intent, limited</text>
    <text x="482" y="196" font-family="Inter,Arial,sans-serif" font-size="13" fill="#CBD5E1">proof. Controlled</text>
    <text x="482" y="214" font-family="Inter,Arial,sans-serif" font-size="13" fill="#CBD5E1">bids, small budget,</text>
    <text x="482" y="232" font-family="Inter,Arial,sans-serif" font-size="13" fill="#CBD5E1">watch conversion.</text>
  </g>
  <!-- Avoid -->
  <g>
    <rect x="670" y="110" width="190" height="150" rx="12" fill="#FF6B35"/>
    <text x="692" y="146" font-family="'Plus Jakarta Sans',Arial,sans-serif" font-size="13" font-weight="700" fill="#0D1B2A">AVOID</text>
    <text x="692" y="178" font-family="Inter,Arial,sans-serif" font-size="13" fill="#FFF1EC">Too broad, too</text>
    <text x="692" y="196" font-family="Inter,Arial,sans-serif" font-size="13" fill="#FFF1EC">concentrated, or bad</text>
    <text x="692" y="214" font-family="Inter,Arial,sans-serif" font-size="13" fill="#FFF1EC">page fit. Don't force</text>
    <text x="692" y="232" font-family="Inter,Arial,sans-serif" font-size="13" fill="#FFF1EC">spend on volume.</text>
  </g>

  <text x="40" y="312" font-family="Inter,Arial,sans-serif" font-size="14" fill="#64748B">A keyword becomes an opportunity only when the product can win clicks, convert them, and do it near target ACoS.</text>
  <text x="40" y="338" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600" fill="#1A56DB">SellTru &#183; Amazon &amp; Walmart PPC</text>
</svg>
