<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="340" fill="#F8FAFC" rx="12"/>
  <text x="24" y="34" font-size="16" font-weight="700" fill="#0D1B2A">Where Amazon PPC Budget Leaks in an Unaudited Account</text>
  <text x="24" y="54" font-size="12" fill="#64748B">Typical share of monthly ad spend recovered per audit category</text>

  <!-- bar 1 -->
  <text x="24" y="96" font-size="13" fill="#0D1B2A">Non-converting search terms</text>
  <rect x="260" y="80" width="330" height="22" rx="4" fill="#E2E8F0"/>
  <rect x="260" y="80" width="230" height="22" rx="4" fill="#1A56DB"/>
  <text x="500" y="96" font-size="13" font-weight="700" fill="#0D1B2A">15–25%</text>

  <!-- bar 2 -->
  <text x="24" y="140" font-size="13" fill="#0D1B2A">Auto campaign overspend</text>
  <rect x="260" y="124" width="330" height="22" rx="4" fill="#E2E8F0"/>
  <rect x="260" y="124" width="120" height="22" rx="4" fill="#1A56DB"/>
  <text x="390" y="140" font-size="13" font-weight="700" fill="#0D1B2A">6–9%</text>

  <!-- bar 3 -->
  <text x="24" y="184" font-size="13" fill="#0D1B2A">Budget misallocated across ASINs</text>
  <rect x="260" y="168" width="330" height="22" rx="4" fill="#E2E8F0"/>
  <rect x="260" y="168" width="150" height="22" rx="4" fill="#FF6B35"/>
  <text x="420" y="184" font-size="13" font-weight="700" fill="#0D1B2A">8–12%</text>

  <!-- bar 4 -->
  <text x="24" y="228" font-size="13" fill="#0D1B2A">Stale bids, never revisited</text>
  <rect x="260" y="212" width="330" height="22" rx="4" fill="#E2E8F0"/>
  <rect x="260" y="212" width="90" height="22" rx="4" fill="#FF6B35"/>
  <text x="360" y="228" font-size="13" font-weight="700" fill="#0D1B2A">4–6%</text>

  <text x="24" y="290" font-size="12" fill="#64748B">Based on SellTru account audits, 2025–2026. Individual results vary by account age and category.</text>
</svg>
