<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="-apple-system,'Segoe UI',Arial,sans-serif">
  <rect width="1200" height="560" rx="18" fill="#0D1B2A"/>
  <text x="60" y="78" fill="#FFFFFF" font-size="34" font-weight="800">Amazon Q4 2026: Every Deadline That Matters</text>
  <text x="60" y="112" fill="#8FA3B8" font-size="18">Inbound cutoffs, deal windows, and peak fees — plan backward from these dates</text>

  <!-- timeline base -->
  <line x1="80" y1="300" x2="1120" y2="300" stroke="#2A3F55" stroke-width="4"/>

  <!-- peak fee band -->
  <rect x="640" y="288" width="480" height="24" rx="12" fill="#FF6B35" opacity="0.25"/>
  <text x="880" y="345" fill="#FF9E75" font-size="15" text-anchor="middle">Holiday peak fulfillment fees: Oct 15 — Jan 14</text>

  <!-- PBDD group -->
  <text x="250" y="170" fill="#4C8DFF" font-size="18" font-weight="700" text-anchor="middle">PRIME BIG DEAL DAYS</text>
  <circle cx="150" cy="300" r="10" fill="#1A56DB"/>
  <text x="150" y="240" fill="#FFFFFF" font-size="16" font-weight="700" text-anchor="middle">Sep 2</text>
  <text x="150" y="262" fill="#8FA3B8" font-size="13" text-anchor="middle">AWD cutoff</text>
  <circle cx="255" cy="300" r="10" fill="#1A56DB"/>
  <text x="255" y="365" fill="#FFFFFF" font-size="16" font-weight="700" text-anchor="middle">Sep 9</text>
  <text x="255" y="387" fill="#8FA3B8" font-size="13" text-anchor="middle">FBA minimal splits</text>
  <circle cx="360" cy="300" r="10" fill="#1A56DB"/>
  <text x="360" y="240" fill="#FFFFFF" font-size="16" font-weight="700" text-anchor="middle">Sep 16</text>
  <text x="360" y="262" fill="#8FA3B8" font-size="13" text-anchor="middle">FBA optimized splits</text>

  <!-- BFCM group -->
  <text x="800" y="170" fill="#FF6B35" font-size="18" font-weight="700" text-anchor="middle">BLACK FRIDAY / CYBER MONDAY</text>
  <circle cx="680" cy="300" r="10" fill="#FF6B35"/>
  <text x="680" y="240" fill="#FFFFFF" font-size="16" font-weight="700" text-anchor="middle">Oct 14</text>
  <text x="680" y="262" fill="#8FA3B8" font-size="13" text-anchor="middle">AWD cutoff</text>
  <circle cx="800" cy="300" r="10" fill="#FF6B35"/>
  <text x="800" y="365" fill="#FFFFFF" font-size="16" font-weight="700" text-anchor="middle">Oct 21</text>
  <text x="800" y="387" fill="#8FA3B8" font-size="13" text-anchor="middle">FBA minimal splits</text>
  <circle cx="920" cy="300" r="10" fill="#FF6B35"/>
  <text x="920" y="240" fill="#FFFFFF" font-size="16" font-weight="700" text-anchor="middle">Oct 28</text>
  <text x="920" y="262" fill="#8FA3B8" font-size="13" text-anchor="middle">FBA optimized splits</text>

  <!-- deal windows -->
  <rect x="60" y="430" width="1080" height="80" rx="12" fill="#13253A"/>
  <text x="90" y="463" fill="#FFFFFF" font-size="16" font-weight="700">Deal submission windows:</text>
  <text x="90" y="490" fill="#8FA3B8" font-size="15">Prime Big Deal Days — closed Sep 8   •   Black Friday Week &amp; Cyber Monday — open through Oct 20</text>
  <text x="1120" y="545" fill="#42546B" font-size="12" text-anchor="end">selltru.com</text>
</svg>
