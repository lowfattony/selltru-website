<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="-apple-system,'Segoe UI',Arial,sans-serif">
  <rect width="1200" height="560" rx="18" fill="#0D1B2A"/>
  <text x="60" y="78" fill="#FFFFFF" font-size="34" font-weight="800">The External Traffic Flywheel</text>
  <text x="60" y="112" fill="#8FA3B8" font-size="18">Tagged off-Amazon traffic compounds into organic rank — and Amazon rebates it</text>

  <!-- channels -->
  <g font-size="15" fill="#FFFFFF" text-anchor="middle">
    <rect x="70" y="180" width="190" height="52" rx="10" fill="#13253A" stroke="#2A3F55"/>
    <text x="165" y="212">Email / SMS list</text>
    <rect x="70" y="248" width="190" height="52" rx="10" fill="#13253A" stroke="#2A3F55"/>
    <text x="165" y="280">Influencers / affiliates</text>
    <rect x="70" y="316" width="190" height="52" rx="10" fill="#13253A" stroke="#2A3F55"/>
    <text x="165" y="348">Google Ads</text>
    <rect x="70" y="384" width="190" height="52" rx="10" fill="#13253A" stroke="#2A3F55"/>
    <text x="165" y="416">Meta / TikTok</text>
  </g>

  <!-- attribution gate -->
  <path d="M270 310 L370 310" stroke="#4C8DFF" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="380" y="270" width="230" height="80" rx="12" fill="#1A56DB"/>
  <text x="495" y="303" fill="#FFFFFF" font-size="17" font-weight="700" text-anchor="middle">Amazon Attribution</text>
  <text x="495" y="328" fill="#DCE6F5" font-size="13" text-anchor="middle">one tag per channel per product</text>

  <!-- listing -->
  <path d="M610 310 L700 310" stroke="#4C8DFF" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="710" y="270" width="200" height="80" rx="12" fill="#13253A" stroke="#2A3F55"/>
  <text x="810" y="303" fill="#FFFFFF" font-size="17" font-weight="700" text-anchor="middle">Your listing</text>
  <text x="810" y="328" fill="#8FA3B8" font-size="13" text-anchor="middle">must convert first</text>

  <!-- outcomes -->
  <path d="M910 290 L990 240" stroke="#FF6B35" stroke-width="3" marker-end="url(#arrO)"/>
  <path d="M910 330 L990 380" stroke="#FF6B35" stroke-width="3" marker-end="url(#arrO)"/>
  <rect x="1000" y="200" width="150" height="60" rx="10" fill="#FF6B35" opacity="0.9"/>
  <text x="1075" y="226" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">~10% Brand</text>
  <text x="1075" y="246" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">Referral Bonus</text>
  <rect x="1000" y="350" width="150" height="60" rx="10" fill="#13253A" stroke="#2A3F55"/>
  <text x="1075" y="376" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">Sales velocity</text>
  <text x="1075" y="396" fill="#8FA3B8" font-size="13" text-anchor="middle">→ organic rank</text>

  <text x="600" y="500" fill="#8FA3B8" font-size="15" text-anchor="middle">Rank compounds → more organic sales → more budget for traffic → repeat</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#4C8DFF" stroke-width="2"/></marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#FF6B35" stroke-width="2"/></marker>
  </defs>
  <text x="1120" y="545" fill="#42546B" font-size="12" text-anchor="end">selltru.com</text>
</svg>
